<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サッカー試合管理</title>
<style>
  body { font-family: Arial, sans-serif; margin:20px; background:#f0f0f0; }
  h2 { margin-top:30px; }
  input, textarea, select, button { margin:5px 0; padding:5px; width:300px; }
  #formation { display:grid; grid-template-columns:repeat(5, 60px); gap:5px; margin-top:10px; }
  .player { background:#4CAF50; color:white; text-align:center; padding:10px; cursor:grab; user-select:none; }
  .tag { display:inline-block; background:#2196F3; color:white; padding:5px 10px; margin:3px; border-radius:5px; }
  #memos p { background:#ffeb3b; padding:5px; margin:3px 0; }
  video { display:block; margin-top:10px; max-width:100%; }
</style>
</head>
<body>

<h1>サッカー試合管理</h1>

<!-- 試合情報 -->
<h2>試合情報</h2>
<label>試合名: <input id="matchName" placeholder="チームA vs チームB"></label><br>
<label>試合開始時間: <input id="matchTime" type="time"></label><br>
<label>会場: <input id="matchVenue"></label>

<!-- チーム情報 -->
<h2>チーム情報</h2>
<label>スタメン（カンマ区切りで下の名前）:<br>
<textarea id="starters" rows="2" placeholder="太郎, 次郎, 三郎..."></textarea></label><br>

<label>ベンチ（カンマ区切り）:<br>
<textarea id="bench" rows="2"></textarea></label><br>

<label>スタッフ（カンマ区切り）:<br>
<textarea id="staff" rows="1"></textarea></label><br>

<!-- フォーメーション -->
<h2>フォーメーション</h2>
<button id="addFormation">表示</button>
<div id="formation"></div>

<!-- タグ -->
<h2>タグ</h2>
<input id="newTag" placeholder="タグ名">
<button id="addTag">追加</button>
<div id="tags"></div>

<!-- メモ -->
<h2>メモ</h2>
<textarea id="newMemo" rows="2" placeholder="メモを入力"></textarea><br>
<button id="addMemo">追加</button>
<div id="memos"></div>

<!-- 動画 -->
<h2>動画</h2>
<input id="videoFile" type="file" accept="video/*"><br>
<video id="video" controls></video><br>
<label>再生速度:
<select id="playbackRate">
  <option value="0.25">0.25x</option>
  <option value="0.5">0.5x</option>
  <option value="1" selected>1x</option>
  <option value="1.5">1.5x</option>
  <option value="2">2x</option>
</select></label>

<!-- 保存 -->
<h2>保存</h2>
<button id="saveAll">すべて保存</button>

<script>
  // --- フォーメーション ---
  const formationGrid = document.getElementById('formation');
  const addFormationBtn = document.getElementById('addFormation');
  let dragged = null;

  function renderFormation() {
    formationGrid.innerHTML = '';
    const names = document.getElementById('starters').value.split(',').map(n => n.trim());
    for (let i = 0; i < 10; i++) {
      const div = document.createElement('div');
      div.className = 'player';
      div.draggable = true;
      div.textContent = names[i] || '';

      // ドラッグ
      div.addEventListener('dragstart', e => { dragged = div; });
      div.addEventListener('dragover', e => e.preventDefault());
      div.addEventListener('drop', e => {
        e.preventDefault();
        if(dragged && dragged!==div){
          const draggedIndex = Array.from(formationGrid.children).indexOf(dragged);
          const dropIndex = Array.from(formationGrid.children).indexOf(div);
          if(draggedIndex < dropIndex){
            formationGrid.insertBefore(dragged, div.nextSibling);
          } else {
            formationGrid.insertBefore(dragged, div);
          }
        }
        dragged = null;
      });

      formationGrid.appendChild(div);
    }
  }

  addFormationBtn.addEventListener('click', renderFormation);

  // --- タグ ---
  const tagsDiv = document.getElementById('tags');
  document.getElementById('addTag').addEventListener('click', () => {
    const tagName = document.getElementById('newTag').value.trim();
    if(!tagName) return;
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = tagName;
    tagsDiv.appendChild(tag);
    document.getElementById('newTag').value='';
  });

  // --- メモ ---
  const memosDiv = document.getElementById('memos');
  document.getElementById('addMemo').addEventListener('click', () => {
    const text = document.getElementById('newMemo').value.trim();
    if(!text) return;
    const p = document.createElement('p');
    p.textContent = text;
    memosDiv.appendChild(p);
    document.getElementById('newMemo').value='';
  });

  // --- 動画 ---
  const video = document.getElementById('video');
  document.getElementById('videoFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    video.src = URL.createObjectURL(file);
  });
  document.getElementById('playbackRate').addEventListener('change', e => {
    video.playbackRate = parseFloat(e.target.value);
  });

  // --- 保存 ---
  document.getElementById('saveAll').addEventListener('click', () => {
    const data = {
      matchInfo: {
        name: document.getElementById('matchName').value,
        time: document.getElementById('matchTime').value,
        venue: document.getElementById('matchVenue').value
      },
      teamInfo: {
        starters: document.getElementById('starters').value.split(',').map(n=>n.trim()),
        bench: document.getElementById('bench').value.split(',').map(n=>n.trim()),
        staff: document.getElementById('staff').value.split(',').map(n=>n.trim()),
        formation: Array.from(formationGrid.children).map(c=>c.textContent)
      },
      tags: Array.from(tagsDiv.children).map(c=>c.textContent),
      memos: Array.from(memosDiv.children).map(c=>c.textContent),
      video: video.src
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download='match_data.json';
    a.click();
  });
</script>
</body>
</html>
