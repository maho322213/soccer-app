<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サッカー試合管理 完全最終版</title>
<style>
body { font-family: Arial; margin:20px; background:#f7f7f7; }
h2 { margin-top:20px; }
.container { display:flex; flex-wrap:wrap; gap:20px; }
.box { background:white; padding:15px; border-radius:8px; box-shadow:0 0 5px rgba(0,0,0,0.2); }
.team-box { width:300px; }
label { display:block; margin-top:5px; }
input, select, textarea { width:100%; margin-top:3px; margin-bottom:10px; }
button { padding:6px 10px; margin-top:5px; cursor:pointer; }
#videoPreview { width:480px; height:270px; background:black; }
#formation { display:grid; grid-template-columns: repeat(5, 60px); grid-gap:5px; margin-top:10px; }
.player { background:#ddd; padding:5px; text-align:center; border-radius:4px; cursor:move; }
#tags { display:flex; flex-wrap:wrap; gap:5px; }
.tag-btn { padding:5px 10px; border-radius:4px; background:#88c; color:white; cursor:pointer; }
#memoList, #highlightList { max-height:200px; overflow-y:auto; margin-top:10px; background:#eef; padding:5px; border-radius:4px; }
#score { font-size:24px; margin-top:10px; }
.highlight-item { background:#cfc; margin:3px 0; padding:3px; border-radius:3px; cursor:pointer; }
</style>
</head>
<body>

<h1>サッカー試合管理 完全最終版</h1>

<div class="container">

<!-- チーム情報 -->
<div class="box team-box">
<h2>チーム情報</h2>
<label>自チーム名<input id="myTeam" type="text" value="チームA"></label>
<label>相手チーム名<input id="oppTeam" type="text" value="チームB"></label>
<label>スタメン（カンマ区切り）<input id="starters" type="text" value="太郎,次郎,三郎,四郎,五郎,六郎,七郎,八郎,九郎,十郎,十一郎"></label>
<label>ベンチ（カンマ区切り）<input id="bench" type="text" value="十二郎,十三郎,十四郎"></label>
<label>スタッフ（カンマ区切り）<input id="staff" type="text" value="監督,コーチ"></label>
<label>フォーメーション（カンマ区切り）<input id="formationInput" type="text" value="GK,DF,DF,DF,DF,MF,MF,MF,MF,FW,FW"></label>
<button onclick="renderTeam()">表示更新</button>

<h3>フォーメーション</h3>
<div id="formation"></div>
</div>

<!-- 試合管理 -->
<div class="box">
<h2>試合管理</h2>
<div>試合時間: <span id="matchTime">00:00</span></div>
<div id="score">0 - 0</div>
<button onclick="startMatch()">試合開始</button>
<button onclick="pauseMatch()">一時停止</button>
<button onclick="resetMatch()">リセット</button>

<h3>動画録画</h3>
<video id="videoPreview" autoplay muted></video><br>
<button onclick="startRecording()">録画開始</button>
<button onclick="stopRecording()">録画停止</button>

<h3>プレータグ付け</h3>
<div id="tags"></div>
<input id="newTag" placeholder="オリジナルタグ追加">
<button onclick="addTag()">追加</button>

<h3>メモ / コメント</h3>
<textarea id="memoInput" placeholder="メモ入力"></textarea>
<button onclick="addMemo()">追加</button>
<div id="memoList"></div>

<h3>ハイライト</h3>
<div id="highlightList"></div>

<h3>データ保存・共有</h3>
<button onclick="downloadData()">JSONで保存</button>
</div>
</div>

<script>
let matchSeconds = 0;
let matchInterval = null;
let myScore = 0;
let oppScore = 0;
let tags = ["シュート","コーナーキック","フリーキック","ファウル","ゴール"];
let mediaRecorder;
let recordedBlobs = [];
let highlights = [];
let memos = [];

function renderTeam(){
  const formationContainer = document.getElementById("formation");
  formationContainer.innerHTML="";
  const formationInput = document.getElementById("formationInput").value.split(",");
  formationInput.forEach(player => {
    const div = document.createElement("div");
    div.className = "player";
    div.innerText = player;
    div.draggable = true;
    div.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', e.target.innerText); });
    div.addEventListener('dragover', e => e.preventDefault());
    div.addEventListener('drop', e => {
      e.preventDefault();
      const dragged = e.dataTransfer.getData('text');
      const targetText = e.target.innerText;
      e.target.innerText = dragged;
      formationInput[formationInput.indexOf(dragged)] = targetText;
      formationInput[formationInput.indexOf(targetText)] = dragged;
    });
    formationContainer.appendChild(div);
  });
}

function startMatch(){
  if(matchInterval) return;
  matchInterval = setInterval(()=>{
    matchSeconds++;
    document.getElementById("matchTime").innerText = 
      String(Math.floor(matchSeconds/60)).padStart(2,"0") + ":" + String(matchSeconds%60).padStart(2,"0");
  },1000);
}

function pauseMatch(){
  clearInterval(matchInterval);
  matchInterval = null;
}

function resetMatch(){
  pauseMatch();
  matchSeconds=0;
  document.getElementById("matchTime").innerText="00:00";
  myScore=0; oppScore=0;
  updateScore();
  highlights=[];
  memos=[];
  document.getElementById("highlightList").innerHTML="";
  document.getElementById("memoList").innerHTML="";
}

function updateScore(){ document.getElementById("score").innerText = myScore+" - "+oppScore; }

function addTag(){
  const t = document.getElementById("newTag").value.trim();
  if(t && !tags.includes(t)){
    tags.push(t);
    renderTags();
  }
  document.getElementById("newTag").value="";
}

function renderTags(){
  const container = document.getElementById("tags");
  container.innerHTML="";
  tags.forEach(tag => {
    const btn = document.createElement("button");
    btn.className="tag-btn";
    btn.innerText = tag;
    btn.onclick = ()=>{
      const time = document.getElementById("matchTime").innerText;
      const hl = {tag,time};
      highlights.push(hl);

      const div = document.createElement("div");
      div.className="highlight-item";
      div.innerText = `[${time}] ${tag}`;
      div.onclick = ()=> alert(`ハイライト再生：${time} の動画部分を再生`);
      document.getElementById("highlightList").appendChild(div);

      if(tag==="ゴール"){ myScore++; updateScore(); }
    }
    container.appendChild(btn);
  });
}

function addMemo(){
  const text = document.getElementById("memoInput").value.trim();
  if(!text) return;
  const div = document.createElement("div");
  const time = document.getElementById("matchTime").innerText;
  div.innerText = `[${time}] ${text}`;
  memos.push({time,text});
  document.getElementById("memoList").appendChild(div);
  document.getElementById("memoInput").value="";
}

// --- 録画 ---
async function startRecording(){
  const video = document.getElementById("videoPreview");
  const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  video.srcObject = stream;
  recordedBlobs = [];
  mediaRecorder = new MediaRecorder(stream,{mimeType:'video/webm'});
  mediaRecorder.ondataavailable = e=>{ if(e.data && e.data.size>0) recordedBlobs.push(e.data); };
  mediaRecorder.start();
}
function stopRecording(){
  mediaRecorder.stop();
  const blob = new Blob(recordedBlobs,{type:'video/webm'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "match_video.webm";
  a.click();
}

// --- データ保存・共有 ---
function downloadData(){
  const data = {
    myTeam: document.getElementById("myTeam").value,
    oppTeam: document.getElementById("oppTeam").value,
    starters: document.getElementById("starters").value.split(","),
    bench: document.getElementById("bench").value.split(","),
    staff: document.getElementById("staff").value.split(","),
    formation: document.getElementById("formationInput").value.split(","),
    matchSeconds,
    myScore,
    oppScore,
    tags,
    highlights,
    memos
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "match_data.json";
  a.click();
}

// 初期描画
renderTeam();
renderTags();
</script>

</body>
</html>
