<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サッカー動画管理システム</title>
<style>
  body { font-family: sans-serif; margin: 20px; background: #f7f7f7; }
  h1,h2 { text-align: center; }
  .section { background: #fff; padding: 15px; margin: 15px 0; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1);}
  input, select, button { margin: 5px; padding: 5px; font-size: 14px; }
  button { cursor: pointer; border-radius: 5px; }
  video { display: block; margin: 10px auto; border: 2px solid #333; border-radius: 6px; width: 90%; max-width: 400px; }
  .flex-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .player { display: inline-block; padding: 5px 8px; background: #eee; border-radius: 4px; margin: 2px; cursor: pointer; }
  .field { width: 100%; max-width: 400px; height: 300px; background: #7ec850; margin: 10px auto; position: relative; border-radius: 8px; border: 2px solid #333;}
  .player-on-field { position: absolute; padding: 4px 6px; background: #fff; border-radius: 4px; border: 1px solid #333; cursor: move; }
  #highlightList button { display: block; margin: 5px 0; }
</style>
</head>
<body>

<h1>⚽ サッカー試合管理</h1>

<div class="section" id="matchInfo">
  <h2>試合情報</h2>
  チーム名: <input id="teamA" placeholder="チームA"> vs <input id="teamB" placeholder="チームB"><br>
  会場: <input id="stadium" placeholder="会場"> 開始時間: <input type="time" id="startTime"><br>
</div>

<div class="section" id="teamInfo">
  <h2>チーム情報</h2>
  <div>
    <strong>スタメン:</strong><br>
    <input id="startersInput" placeholder="選手名,カンマ区切り"><button id="setStarters">反映</button>
    <div id="starters" class="flex-row"></div>
  </div>
  <div>
    <strong>ベンチ:</strong><br>
    <input id="benchInput" placeholder="選手名,カンマ区切り"><button id="setBench">反映</button>
    <div id="bench" class="flex-row"></div>
  </div>
  <div>
    <strong>スタッフ:</strong><br>
    <input id="staffInput" placeholder="名前,カンマ区切り"><button id="setStaff">反映</button>
    <div id="staff" class="flex-row"></div>
  </div>
  <div>
    <strong>フォーメーション:</strong><br>
    <input id="formationInput" placeholder="選手名,カンマ区切り"><button id="setFormation">反映</button>
    <div class="field" id="field"></div>
  </div>
</div>

<div class="section" id="cameraSection">
  <h2>カメラ・録画</h2>
  <video id="preview" autoplay muted playsinline></video>
  <video id="recorded" controls style="display:none;"></video><br>
  <button id="startBtn" style="background:#28a745;color:#fff;">撮影開始</button>
  <button id="stopBtn" style="background:#dc3545;color:#fff;" disabled>停止</button>
  <button id="saveBtn" style="background:#2196f3;color:#fff;" disabled>保存＆再生</button>
  <button id="switchBtn" style="background:#007bff;color:#fff;">カメラ切替</button>
</div>

<div class="section" id="tagsSection">
  <h2>タグ付け</h2>
  <div id="tagContainer" class="flex-row">
    <button class="tagBtn" data-tag="ゴール">ゴール</button>
    <button class="tagBtn" data-tag="シュート">シュート</button>
    <button class="tagBtn" data-tag="フリーキック">フリーキック</button>
    <button class="tagBtn" data-tag="オフサイド">オフサイド</button>
  </div>
  <input id="newTagInput" placeholder="オリジナルタグ">
  <button id="addTagBtn">追加</button>
  <h3>ハイライト</h3>
  <div id="highlightList"></div>
</div>

<div class="section">
  <h2>メモ・コメント</h2>
  <input type="text" id="sceneNote" placeholder="メモを入力">
  <button id="addNote">メモ追加</button>
  <ul id="notesList"></ul>
</div>

<div class="section">
  <h2>動画再生速度</h2>
  <label for="speedControl">再生速度:</label>
  <select id="speedControl">
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2x</option>
  </select>
</div>

<div class="section">
  <button id="saveAll" style="background:#ff9800;color:#fff;">全データまとめて保存 (JSON)</button>
</div>

<script>
let useFrontCamera = true;
const preview = document.getElementById('preview');
const recorded = document.getElementById('recorded');
let mediaRecorder, recordedChunks = [];

async function initCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: useFrontCamera ? "user" : "environment" }, audio:true});
  preview.srcObject = stream;
  return stream;
}

document.getElementById('switchBtn').onclick = () => { useFrontCamera = !useFrontCamera; initCamera(); };
document.getElementById('startBtn').onclick = async () => {
  const stream = await initCamera();
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type:'video/webm' });
    recorded.src = URL.createObjectURL(blob);
    recorded.style.display = 'block';
  };
  mediaRecorder.start();
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('saveBtn').disabled = true;
};
document.getElementById('stopBtn').onclick = () => {
  mediaRecorder.stop();
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('saveBtn').disabled = false;
};
document.getElementById('saveBtn').onclick = () => recorded.play();

document.getElementById('speedControl').onchange = e => { recorded.playbackRate = parseFloat(e.target.value); };

let tagData = [], recordedTags = [];

function updateHighlights() {
  const highlightList = document.getElementById('highlightList');
  highlightList.innerHTML = '';
  recordedTags.forEach(entry => {
    const btn = document.createElement('button');
    btn.textContent = `${entry.tag} (${Math.floor(entry.time/60)}:${Math.floor(entry.time%60).toString().padStart(2,'0')})`;
    btn.onclick = () => playHighlight(entry.time);
    highlightList.appendChild(btn);
  });
}

function playHighlight(time){
  const start = Math.max(0,time-5);
  const end = Math.min(recorded.duration,time+5);
  recorded.currentTime = start;
  recorded.play();
  const interval = setInterval(() => {
    if(recorded.currentTime>=end){ recorded.pause(); clearInterval(interval); }
  },100);
}

document.querySelectorAll('.tagBtn').forEach(btn => {
  btn.onclick = () => {
    const tag = btn.getAttribute('data-tag');
    const timestamp = recorded.currentTime.toFixed(2);
    tagData.push({ tag, timestamp });
    recordedTags.push({ tag, time: recorded.currentTime });
    updateHighlights();
  };
});

document.getElementById('addTagBtn').onclick = () => {
  const tagName = document.getElementById('newTagInput').value.trim();
  if(!tagName) return;
  const newBtn = document.createElement('button');
  newBtn.classList.add('tagBtn');
  newBtn.setAttribute('data-tag', tagName);
  newBtn.textContent = tagName;
  document.getElementById('tagContainer').appendChild(newBtn);
  newBtn.onclick = () => {
    tagData.push({ tag: tagName, timestamp: recorded.currentTime.toFixed(2) });
    recordedTags.push({ tag: tagName, time: recorded.currentTime });
    updateHighlights();
  };
  document.getElementById('newTagInput').value = '';
};

// メモ
document.getElementById('addNote').onclick = () => {
  const note = document.getElementById('sceneNote').value.trim();
  if(!note) return;
  const li = document.createElement('li'); li.textContent = note;
  document.getElementById('notesList').appendChild(li);
  document.getElementById('sceneNote').value = '';
};

// チーム情報
function setList(inputId, displayId){
  const names = document.getElementById(inputId).value.split(',').map(n=>n.trim()).filter(n=>n);
  const container = document.getElementById(displayId);
  container.innerHTML = '';
  names.forEach(n=>{
    const div = document.createElement('div'); div.className='player'; div.textContent = n;
    container.appendChild(div);
  });
}

document.getElementById('setStarters').onclick = ()=>setList('startersInput','starters');
document.getElementById('setBench').onclick = ()=>setList('benchInput','bench');
document.getElementById('setStaff').onclick = ()=>setList('staffInput','staff');

// フォーメーション表示
document.getElementById('setFormation').onclick = ()=>{
  const names = document.getElementById('formationInput').value.split(',').map(n=>n.trim()).filter(n=>n);
  const field = document.getElementById('field');
  field.innerHTML='';
  const positions = [
    {top:'260px', left:'170px'}, // GK
    {top:'200px', left:'50px'}, {top:'200px', left:'120px'}, {top:'200px', left:'220px'}, {top:'200px', left:'290px'}, // DF
    {top:'140px', left:'50px'}, {top:'140px', left:'120px'}, {top:'140px', left:'220px'}, {top:'140px', left:'290px'}, // MF
    {top:'60px', left:'120px'}, {top:'60px', left:'220px'} // FW
  ];
  names.forEach((n,i)=>{
    const div = document.createElement('div'); div.className='player-on-field'; div.textContent=n;
    div.style.top = positions[i]?.top || '0px';
    div.style.left = positions[i]?.left || '0px';
    div.draggable=true;
    div.ondragstart = e=>{ e.dataTransfer.setData("text/plain",i); };
    field.appendChild(div);
  });
};

// 全データ保存
document.getElementById('saveAll').onclick = ()=>{
  const data = {
    match:{teamA:document.getElementById('teamA').value, teamB:document.getElementById('teamB').value,
           stadium:document.getElementById('stadium').value, startTime:document.getElementById('startTime').value},
    starters: Array.from(document.getElementById('starters').children).map(d=>d.textContent),
    bench: Array.from(document.getElementById('bench').children).map(d=>d.textContent),
    staff: Array.from(document.getElementById('staff').children).map(d=>d.textContent),
    formation: Array.from(document.getElementById('field').children).map(d=>d.textContent),
    tags: tagData,
    notes: Array.from(document.getElementById('notesList').children).map(li=>li.textContent)
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download='match_data.json';
  a.click();
};
</script>

</body>
</html>
