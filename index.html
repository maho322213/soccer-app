<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試合撮影＆フォーメーション管理</title>
<style>
  body { font-family: sans-serif; text-align: center; background-color: #f4f4f4; padding: 20px; }
  video { width: 90%; max-width: 400px; margin-top: 10px; border: 3px solid #333; border-radius: 8px; }
  input, select, button { margin: 5px; padding: 8px; font-size: 14px; border-radius: 5px; }
  #field { position: relative; width: 640px; height: 360px; margin: 10px auto; background-color: #4CAF50; border: 2px solid #333; border-radius: 8px; }
  .player { position: absolute; padding: 4px 6px; background-color: #fff; border: 1px solid #000; border-radius: 50%; cursor: grab; user-select: none; }
  #highlightList button { display:block; margin: 3px; }
</style>
</head>
<body>

<h1>🎥 試合撮影＆フォーメーション管理</h1>

<!-- チーム情報入力 -->
<div>
  <input type="text" id="team1" placeholder="チーム1名">
  <input type="text" id="team2" placeholder="チーム2名">
  <input type="text" id="venue" placeholder="試合会場">
  <input type="time" id="startTime">
</div>

<!-- 動画 -->
<video id="preview" autoplay muted></video>
<br>
<button id="startBtn">撮影開始</button>
<button id="stopBtn" disabled>撮影停止</button>
<button id="saveBtn" disabled>保存＆再生</button>
<video id="recorded" controls style="display:none;"></video>

<!-- 再生速度 -->
<label for="speedControl">再生速度:</label>
<select id="speedControl">
  <option value="0.5">0.5x</option>
  <option value="1" selected>1x</option>
  <option value="1.5">1.5x</option>
  <option value="2">2x</option>
</select>

<!-- タグ機能 -->
<div id="tagContainer">
  <button class="tagBtn" data-tag="ゴール">ゴール</button>
  <button class="tagBtn" data-tag="シュート">シュート</button>
  <button class="tagBtn" data-tag="フリーキック">フリーキック</button>
  <button class="tagBtn" data-tag="オフサイド">オフサイド</button>
</div>
<input type="text" id="newTagInput" placeholder="オリジナルタグ">
<button id="addTagBtn">追加</button>

<h2>ハイライト</h2>
<div id="highlightList"></div>

<!-- メモ -->
<input type="text" id="sceneNote" placeholder="メモ入力">
<button id="addNote">メモ追加</button>
<ul id="notesList"></ul>

<!-- フォーメーション -->
<h2>フォーメーション（名前表示・ドラッグ可）</h2>
<div id="field"></div>
<input type="text" id="playerName" placeholder="選手名">
<button id="addPlayerBtn">選手追加</button>

<!-- データ保存 -->
<button id="saveAllBtn">全データ保存(JSON)</button>

<script>
let useFrontCamera = true;
let mediaRecorder;
let recordedChunks = [];
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const saveBtn = document.getElementById('saveBtn');
const preview = document.getElementById('preview');
const recorded = document.getElementById('recorded');
const video = document.getElementById('recorded');
const speedControl = document.getElementById('speedControl');
const tagContainer = document.getElementById('tagContainer');
const newTagInput = document.getElementById('newTagInput');
const addTagBtn = document.getElementById('addTagBtn');
const highlightList = document.getElementById('highlightList');
const notesList = document.getElementById('notesList');
const sceneNote = document.getElementById('sceneNote');
const field = document.getElementById('field');
const playerNameInput = document.getElementById('playerName');
const addPlayerBtn = document.getElementById('addPlayerBtn');
const saveAllBtn = document.getElementById('saveAllBtn');

// カメラ初期化
async function initCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
  preview.srcObject = stream;
  return stream;
}

// 録画
startBtn.onclick = async () => {
  const stream = await initCamera();
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, {type:'video/webm'});
    recorded.src = URL.createObjectURL(blob);
    recorded.style.display = 'block';
  };
  mediaRecorder.start();
  startBtn.disabled = true;
  stopBtn.disabled = false;
  saveBtn.disabled = true;
};
stopBtn.onclick = () => { mediaRecorder.stop(); startBtn.disabled=false; stopBtn.disabled=true; saveBtn.disabled=false; };
saveBtn.onclick = () => recorded.play();

// 再生速度
speedControl.onchange = e => video.playbackRate = parseFloat(e.target.value);

// タグ機能
let tagData = [];
document.querySelectorAll('.tagBtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    tagData.push({tag: btn.dataset.tag, timestamp: video.currentTime.toFixed(2)});
    updateHighlights();
  });
});
addTagBtn.onclick = ()=>{
  const tagName = newTagInput.value.trim();
  if(!tagName) return;
  const btn = document.createElement('button');
  btn.textContent = tagName; btn.dataset.tag = tagName; btn.classList.add('tagBtn');
  tagContainer.appendChild(btn);
  btn.onclick = ()=>{ tagData.push({tag: tagName, timestamp: video.currentTime.toFixed(2)}); updateHighlights(); }
  newTagInput.value = '';
};
function updateHighlights() {
  highlightList.innerHTML = '';
  tagData.forEach(item=>{
    const btn = document.createElement('button');
    btn.textContent = `${item.tag} (${formatTime(item.timestamp)})`;
    btn.onclick = ()=>{ video.currentTime = item.timestamp; video.play(); };
    highlightList.appendChild(btn);
  });
}
function formatTime(s){ const m=Math.floor(s/60); const sec=Math.floor(s%60); return `${m}:${sec.toString().padStart(2,'0')}`; }

// メモ
document.getElementById('addNote').onclick = ()=>{
  const text = sceneNote.value.trim(); if(!text) return;
  const li = document.createElement('li'); li.textContent=text; notesList.appendChild(li);
  sceneNote.value='';
};

// フォーメーション（名前表示・ドラッグ可）
let playerCount=0;
addPlayerBtn.onclick = ()=>{
  const name = playerNameInput.value.trim(); if(!name) return;
  const div = document.createElement('div');
  div.className='player'; div.textContent=name;
  div.style.left = (Math.random()*500)+'px';
  div.style.top = (Math.random()*300)+'px';
  div.draggable = true;
  div.ondragstart = e=>{ e.dataTransfer.setData('text/plain', e.target.dataset.index); e.dataTransfer.setDragImage(new Image(),0,0); }
  field.appendChild(div);
  playerNameInput.value='';
  playerCount++;
};

// ドラッグで移動
field.addEventListener('dragover', e=>e.preventDefault());
field.addEventListener('drop', e=>{
  e.preventDefault();
  const div = document.elementFromPoint(e.clientX, e.clientY);
  if(div && div.classList.contains('player')){
    div.style.left = (e.offsetX - div.offsetWidth/2)+'px';
    div.style.top = (e.offsetY - div.offsetHeight/2)+'px';
  }
});

// 全データ保存
saveAllBtn.onclick = ()=>{
  const data = {
    teams: [document.getElementById('team1').value, document.getElementById('team2').value],
    venue: document.getElementById('venue').value,
    startTime: document.getElementById('startTime').value,
    tags: tagData,
    notes: Array.from(notesList.querySelectorAll('li')).map(li=>li.textContent),
    formation: Array.from(field.querySelectorAll('.player')).map(p=>({name:p.textContent, left:p.style.left, top:p.style.top}))
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='match_data.json'; a.click();
};
</script>
</body>
</html>
