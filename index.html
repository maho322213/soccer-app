<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サッカー試合管理アプリ 完全版</title>
<style>
  body { font-family: Arial, sans-serif; background:#f0f2f5; margin:0; padding:0;}
  header { background:#007bff; color:#fff; padding:10px; text-align:center;}
  main { display:flex; padding:10px; gap:10px; }
  section { background:#fff; padding:10px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.2);}
  #video-section { flex:2; }
  #info-section { flex:1; display:flex; flex-direction:column; gap:10px; }
  button { margin:2px; padding:5px 10px; }
  #tags button { margin:2px; }
  #formation { display:grid; grid-template-columns: repeat(5, 50px); grid-auto-rows: 50px; gap:5px;}
  .player { background:#007bff; color:#fff; display:flex; align-items:center; justify-content:center; border-radius:50%; cursor:grab; }
  #hightlights, #memos { max-height:150px; overflow-y:auto; border:1px solid #ccc; padding:5px; }
</style>
</head>
<body>
<header>
  <h1>サッカー試合管理アプリ 完全版</h1>
</header>
<main>
  <section id="video-section">
    <video id="video" width="640" controls></video><br>
    <button id="startBtn">録画開始</button>
    <button id="stopBtn">録画停止</button>
    <button id="slowBtn">スロー再生</button>
    <p>試合時間: <span id="timer">00:00</span></p>
  </section>
  <section id="info-section">
    <h3>試合情報</h3>
    チームA: <input id="teamA" placeholder="チームA"><br>
    チームB: <input id="teamB" placeholder="チームB"><br>
    会場: <input id="venue" placeholder="会場"><br>
    開始時間: <input type="time" id="startTime"><br>

    <h3>スタメン（名前）</h3>
    <div id="starters"></div>
    <h3>ベンチ</h3>
    <div id="bench"></div>
    <h3>スタッフ</h3>
    <div id="staff"></div>
    <h3>フォーメーション（ドラッグ可能）</h3>
    <div id="formation"></div>

    <h3>タグ</h3>
    <div id="tags">
      <button data-tag="シュート">シュート</button>
      <button data-tag="コーナーキック">コーナーキック</button>
      <button data-tag="フリーキック">フリーキック</button>
      <button data-tag="ファウル">ファウル</button>
      <button data-tag="ゴール">ゴール</button>
      <input id="customTag" placeholder="オリジナルタグ">
      <button id="addCustomTag">追加</button>
    </div>

    <h3>ハイライト</h3>
    <div id="hightlights"></div>

    <h3>メモ（時間に紐づく）</h3>
    <input id="memoInput" placeholder="メモを入力">
    <button id="addMemo">追加</button>
    <div id="memos"></div>

    <h3>データ保存</h3>
    <button id="saveBtn">保存（JSON）</button>
    <input type="file" id="loadFile">
  </section>
</main>

<script>
let mediaRecorder, recordedChunks = [];
let video = document.getElementById('video');
let timerSpan = document.getElementById('timer');
let startTimeSec = 0, timerInterval;

const startersDiv = document.getElementById('starters');
const benchDiv = document.getElementById('bench');
const staffDiv = document.getElementById('staff');
const formationDiv = document.getElementById('formation');
const highlightsDiv = document.getElementById('hightlights');
const memosDiv = document.getElementById('memos');

let tagsData = [];

function updateTimer() {
    startTimeSec++;
    let min = String(Math.floor(startTimeSec/60)).padStart(2,'0');
    let sec = String(startTimeSec%60).padStart(2,'0');
    timerSpan.textContent = `${min}:${sec}`;
}

document.getElementById('startBtn').onclick = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    video.srcObject = stream;
    mediaRecorder = new MediaRecorder(stream, {mimeType:"video/webm"});
    mediaRecorder.ondataavailable = e => { if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.start();
    timerInterval = setInterval(updateTimer,1000);
};

document.getElementById('stopBtn').onclick = () => {
    mediaRecorder.stop();
    clearInterval(timerInterval);
    mediaRecorder.onstop = () => {
        let blob = new Blob(recordedChunks,{type:"video/webm"});
        video.src = URL.createObjectURL(blob);
        video.controls = true;
    };
};

document.getElementById('slowBtn').onclick = () => {
    video.playbackRate = video.playbackRate===1 ? 0.5 : 1;
};

// フォーメーション表示（5x5グリッド例）
for(let i=0;i<25;i++){
    let div = document.createElement('div');
    div.className = 'player';
    div.textContent = '';
    div.draggable = true;
    div.ondragstart = e => { e.dataTransfer.setData('text', e.target.textContent); };
    div.ondragover = e => { e.preventDefault(); };
    div.ondrop = e => { let data = e.dataTransfer.getData('text'); let tmp = e.target.textContent; e.target.textContent=data; e.dataTransfer.setData('text',tmp); };
    formationDiv.appendChild(div);
}

// タグ追加
document.querySelectorAll('#tags button[data-tag]').forEach(btn=>{
    btn.onclick = () => {
        tagsData.push({tag:btn.dataset.tag, time:startTimeSec});
        highlightsDiv.innerHTML += `<div>${formatTime(startTimeSec)} - ${btn.dataset.tag}</div>`;
    };
});
document.getElementById('addCustomTag').onclick = () => {
    let val = document.getElementById('customTag').value;
    if(val){
        tagsData.push({tag:val, time:startTimeSec});
        highlightsDiv.innerHTML += `<div>${formatTime(startTimeSec)} - ${val}</div>`;
        document.getElementById('customTag').value='';
    }
};

function formatTime(sec){
    let min = String(Math.floor(sec/60)).padStart(2,'0');
    let s = String(sec%60).padStart(2,'0');
    return `${min}:${s}`;
}

// メモ追加
document.getElementById('addMemo').onclick = () => {
    let text = document.getElementById('memoInput').value;
    if(text){
        let div = document.createElement('div');
        div.textContent = `${formatTime(startTimeSec)} - ${text}`;
        memosDiv.appendChild(div);
        document.getElementById('memoInput').value='';
    }
};

// データ保存
document.getElementById('saveBtn').onclick = () => {
    let data = {
        teamA: document.getElementById('teamA').value,
        teamB: document.getElementById('teamB').value,
        venue: document.getElementById('venue').value,
        startTime: document.getElementById('startTime').value,
        starters: startersDiv.innerText,
        bench: benchDiv.innerText,
        staff: staffDiv.innerText,
        formation: Array.from(formationDiv.children).map(c=>c.textContent),
        tags: tagsData,
        memos: Array.from(memosDiv.children).map(d=>d.textContent),
    };
    let blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'match_data.json';
    a.click();
};
</script>
</body>
</html>
