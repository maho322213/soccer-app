<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>撮影＆再生テスト</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      padding: 20px;
    }
    video {
      width: 90%;
      max-width: 400px;
      margin-top: 20px;
      border: 3px solid #333;
      border-radius: 8px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #startBtn { background-color: #4CAF50; color: white; }
    #stopBtn { background-color: #f44336; color: white; }
    #saveBtn { background-color: #2196F3; color: white; }
  </style>
</head>
<body>
  <h1>🎥 撮影＆再生テスト</h1>

  <video id="preview" autoplay muted></video>
  <br>
  <button id="startBtn">撮影開始</button>
  <button id="switchBtn">カメラ切替</button>
  <button id="stopBtn" disabled>停止</button>
  <button id="saveBtn" disabled>保存＆再生</button>

  <video id="recorded" controls style="display:none;"></video>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const saveBtn = document.getElementById('saveBtn');
    const preview = document.getElementById('preview');
    const recorded = document.getElementById('recorded');

    let mediaRecorder;
    let recordedChunks = [];

    // カメラへのアクセスを要求
    async function initCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      preview.srcObject = stream;
      return stream;
    }

    startBtn.onclick = async () => {
      const stream = await initCamera();
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        recorded.src = URL.createObjectURL(blob);
        recorded.style.display = 'block';
      };
      mediaRecorder.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
      saveBtn.disabled = true;
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      saveBtn.disabled = false;
    };

    saveBtn.onclick = () => {
      recorded.play();
    };
  </script>
</body>
</html>
